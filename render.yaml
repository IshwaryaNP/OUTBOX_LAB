services:
  # ReachInbox Express + BullMQ Backend
  - type: web
    name: reachinbox-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: reachinbox-redis
          property: password
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: 2000
      - key: DEFAULT_HOURLY_LIMIT
        value: 200
      - key: JWT_SECRET
        generateValue: true

  # Managed Redis for BullMQ & Sliding Window Rate Limiting
  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: []

databases:
  # Managed PostgreSQL
  - name: reachinbox-db
    plan: free

